[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.7.6"
optimizer = false
via_ir = false
evm_version = "istanbul"
verbosity = 3

[profile.default.natspec]
enabled = false

[profile.default.optimizer_details]
yul = false

[profile.rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

[profile.etherscan]
sepolia = "${ETHERSCAN_API_KEY}"
mainnet = { key = "${ETHERSCAN_API_KEY}" } 